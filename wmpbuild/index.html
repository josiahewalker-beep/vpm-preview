<script type="module">
import * as THREE from 'three';
import { CSS3DRenderer, CSS3DObject } from './CSS3DRenderer.js';

const G = 160;                                   // one grid cell (world units ≈ CSS px at the card plane)
const still = matchMedia('(prefers-reduced-motion: reduce)').matches;
const $ = id => document.getElementById(id);

// Where each stop sits in the grid (cell coordinates) and how it is turned. The tour weaves deeper and higher.
const ORDER = ['hero', 'produce', 'work', 'onsite', 'event', 'process', 'plans', 'includes', 'next'];
const SPOTS = {
  hero:     { p: [0, 3, 0],     ry: 0 },
  produce:  { p: [10, 4, -6],   ry: -24 },
  work:     { p: [-10, 5, -10], ry: 24 },
  onsite:   { p: [0, 7, -16],   ry: 0 },
  event:    { p: [10, 6, -21],  ry: -22 },
  process:  { p: [-10, 8, -25], ry: 22 },
  plans:    { p: [0, 9, -31],   ry: 0 },
  includes: { p: [10, 8, -35],  ry: -20 },
  next:     { p: [-6, 10, -39], ry: 16 },
};
const OVER = { pos: new THREE.Vector3(), look: new THREE.Vector3() };
function setOverview() {
  const phone = innerWidth < 700;
  OVER.pos.set(phone ? 0 : 0, (phone ? 22 : 17) * G, (phone ? 30 : 22) * G);
  OVER.look.set(0, 5 * G, -16 * G);
}

// ---------- renderers ----------
let gl;
try { gl = new THREE.WebGLRenderer({ canvas: $('gl'), antialias: true }); } catch (e) { gl = null; }
const listWrap = $('listwrap');
function buildList() { if (!listWrap.childElementCount) for (const c of $('cards').content.querySelectorAll('.card')) listWrap.append(c.cloneNode(true)); }
if (!gl) { buildList(); $('list').hidden = false; $('listbtn').hidden = true; $('nextbtn').hidden = true; throw new Error('no webgl'); }
gl.setPixelRatio(Math.min(devicePixelRatio, 2)); gl.setClearColor(0xf6f7f9, 1);
const css = new CSS3DRenderer({ element: $('css') });
const scene = new THREE.Scene(); scene.fog = new THREE.Fog(0xf6f7f9, 2600, 9000);
const cssScene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(40, 1, 10, 20000);

// ---------- the lattice ----------
(function lattice() {
  const X = 18, Z0 = -44, Z1 = 14, YT = 12;
  const floor = [], major = [], cage = [], nodes = [];
  for (let i = -X; i <= X; i++) (i % 4 ? floor : major).push(i * G, 0, Z0 * G, i * G, 0, Z1 * G);
  for (let k = Z0; k <= Z1; k++) (k % 4 ? floor : major).push(-X * G, 0, k * G, X * G, 0, k * G);
  for (let x = -X + 2; x <= X; x += 4) for (let z = Z0; z <= Z1; z += 4) cage.push(x * G, 0, z * G, x * G, YT * G, z * G);
  for (const y of [4, 8, 12]) {
    for (let x = -X + 2; x <= X; x += 4) cage.push(x * G, y * G, Z0 * G, x * G, y * G, Z1 * G);
    for (let z = Z0; z <= Z1; z += 4) cage.push(-X * G, y * G, z * G, X * G, y * G, z * G);
  }
  for (let x = -X; x <= X; x += 2) for (let z = Z0; z <= Z1; z += 2) for (let y = 2; y <= YT; y += 2) if ((x + z + y) % 4 === 0) nodes.push(x * G, y * G, z * G);
  const seg = (arr, color, opacity) => { const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.Float32BufferAttribute(arr, 3)); return new THREE.LineSegments(g, new THREE.LineBasicMaterial({ color, transparent: true, opacity })); };
  scene.add(seg(floor, 0xcfd6e2, 0.6), seg(major, 0xaab5c8, 0.8), seg(cage, 0xc3ccda, 0.42));
  const ng = new THREE.BufferGeometry(); ng.setAttribute('position', new THREE.Float32BufferAttribute(nodes, 3));
  scene.add(new THREE.Points(ng, new THREE.PointsMaterial({ color: 0x8c99b0, size: 6, sizeAttenuation: true, transparent: true, opacity: .7 })));
})();

// ---------- cards in the grid ----------
const tpl = $('cards').content;
const cards = {};
const stemMat = new THREE.LineBasicMaterial({ color: 0x2f5bff, transparent: true, opacity: .32 });
for (const src of tpl.querySelectorAll('.card')) {
  const id = src.dataset.id, s = SPOTS[id], el = src.cloneNode(true);
  const obj = new CSS3DObject(el);
  obj.position.set(s.p[0] * G, s.p[1] * G, s.p[2] * G); obj.rotation.y = THREE.MathUtils.degToRad(s.ry);
  cssScene.add(obj);
  const base = new THREE.Vector3(obj.position.x, 0, obj.position.z);
  scene.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints([base, obj.position.clone().setY(0.01)]), stemMat));
  scene.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints([base.clone(), new THREE.Vector3(obj.position.x, obj.position.y - 320, obj.position.z)]), stemMat));
  const ring = new THREE.Mesh(new THREE.RingGeometry(22, 27, 48), new THREE.MeshBasicMaterial({ color: 0x2f5bff, transparent: true, opacity: .5, side: THREE.DoubleSide }));
  ring.rotation.x = -Math.PI / 2; ring.position.copy(base).setY(1); scene.add(ring);
  cards[id] = { obj, el, ring };
  el.addEventListener('click', e => {
    if (moved > 6) return;
    const go1 = e.target.closest('[data-go]'); if (go1 && current === id) { go(go1.dataset.go); return; }
    if (current !== id) go(id);
  });
}

// ---------- rail ----------
const rail = $('rail');
ORDER.forEach((id, i) => { const b = document.createElement('button'); b.type = 'button'; b.dataset.go = id; b.setAttribute('aria-label', cards[id].el.dataset.label); b.innerHTML = `<span>${String(i + 1).padStart(2, '0')} · ${cards[id].el.dataset.label}</span><i></i>`; rail.append(b); });

// ---------- camera ----------
const cam = { pos: new THREE.Vector3(), look: new THREE.Vector3() };
let yaw = 0, pitch = 0, tYaw = 0, tPitch = 0, current = 'overview', flight = null;
const pan = { y: 0, cur: 0, max: 0, k: 1 };

function viewFor(id) {
  if (id === 'overview') return { pos: OVER.pos.clone(), look: OVER.look.clone() };
  const c = cards[id], o = c.obj;
  const n = new THREE.Vector3(0, 0, 1).applyAxisAngle(new THREE.Vector3(0, 1, 0), o.rotation.y);
  const w = c.el.offsetWidth, h = c.el.offsetHeight;
  const vf = THREE.MathUtils.degToRad(camera.fov), t = Math.tan(vf / 2), aspect = innerWidth / innerHeight;
  const phone = innerWidth < 700;
  const usableH = 1 - (phone ? 0.26 : 0.2);                              // leave room for the header and the bottom bar
  const dW = (w / (phone ? 0.94 : 0.78)) / (2 * t * aspect), dH = (h / usableH) / (2 * t);
  const d = phone && dH > dW * 1.15 ? dW : Math.max(dW, dH);      // phones: fit the width and pan down a tall card
  const visH = 2 * t * d * usableH;                                     // world units of card visible at once
  const panMax = Math.max(0, h - visH);
  // a tall card on a phone starts at its top; the swipe pans down it (see pan below)
  const lift = panMax ? h / 2 - visH / 2 : 0;
  const look = o.position.clone().add(new THREE.Vector3(0, lift + (phone ? -10 : -6), 0));
  return { pos: o.position.clone().addScaledVector(n, d).add(new THREE.Vector3(0, lift, 0)), look, panMax, worldPerPx: visH / (innerHeight * usableH) };
}

// Along grid lines: snap to a node, then height, then x, then z, corners rounded.
function route(a, b) {
  const snap = v => new THREE.Vector3(Math.round(v.x / G) * G, Math.round(v.y / G) * G, Math.round(v.z / G) * G);
  const s = snap(a), e = snap(b), pts = [a.clone(), s], p = s.clone();
  for (const ax of ['y', 'x', 'z']) if (Math.abs(p[ax] - e[ax]) > 1) { p[ax] = e[ax]; pts.push(p.clone()); }
  pts.push(b.clone());
  const P = pts.filter((q, i) => !i || q.distanceTo(pts[i - 1]) > 1), path = new THREE.CurvePath();
  let from = P[0];
  for (let i = 1; i < P.length; i++) {
    const cur = P[i], nx = P[i + 1];
    if (!nx) { path.add(new THREE.LineCurve3(from, cur)); break; }
    const r = Math.min(G * 1.4, cur.distanceTo(from) / 2, cur.distanceTo(nx) / 2);
    const inP = cur.clone().addScaledVector(from.clone().sub(cur).normalize(), r), outP = cur.clone().addScaledVector(nx.clone().sub(cur).normalize(), r);
    if (inP.distanceTo(from) > .5) path.add(new THREE.LineCurve3(from, inP));
    path.add(new THREE.QuadraticBezierCurve3(inP, cur, outP)); from = outP;
  }
  return path;
}
const trailGeo = new THREE.BufferGeometry();
const trail = new THREE.Line(trailGeo, new THREE.LineBasicMaterial({ color: 0x2f5bff, transparent: true, opacity: 0, depthTest: false }));
trail.renderOrder = 9; scene.add(trail);
const headMat = new THREE.PointsMaterial({ color: 0x2f5bff, size: 12, sizeAttenuation: false, transparent: true, opacity: 0, depthTest: false });
const head = new THREE.Points(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3()]), headMat); head.renderOrder = 10; scene.add(head);

const ease = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const smooth = (a, b, x) => { const t = Math.min(1, Math.max(0, (x - a) / (b - a))); return t * t * (3 - 2 * t); };
function eyeNow() { return camera.position.clone(); }
function lookNow() { const d = new THREE.Vector3(); camera.getWorldDirection(d); return camera.position.clone().addScaledVector(d, Math.max(400, cam.pos.distanceTo(cam.look))); }

function go(id) {
  if (id !== 'overview' && !cards[id]) return;
  if (id === current && !flight) return;
  const to = viewFor(id), fromPos = eyeNow(), fromLook = lookNow();
  tYaw = tPitch = yaw = pitch = 0; pan.y = pan.cur = 0; pan.max = 0; mark(null);
  if (still) { cam.pos.copy(to.pos); cam.look.copy(to.look); arrive(id); return; }
  const path = route(fromPos, to.pos), len = path.getLength();
  const pts = path.getSpacedPoints(Math.max(60, Math.round(len / 20)));
  trailGeo.setFromPoints(pts); trailGeo.setDrawRange(0, 0); trail.material.opacity = .95; headMat.opacity = 1;
  flight = { path, pts, t0: performance.now(), dur: Math.min(3600, Math.max(1500, len / 1.9)), fromLook, toLook: to.look, id };
  current = 'flying'; navState(id);
}
function arrive(id) {
  current = id; flight = null; mark(id); navState(id); headMat.opacity = 0;
  { const v = viewFor(id); pan.max = v.panMax || 0; pan.k = v.worldPerPx || 1; pan.y = pan.cur = 0; }
  const t0 = performance.now(), o = trail.material.opacity;
  const f = () => { const k = Math.min(1, (performance.now() - t0) / 1000); trail.material.opacity = o * (1 - k); if (k < 1) requestAnimationFrame(f); }; f();
  if (id === 'event') countUp(cards.event.el);
  const i = ORDER.indexOf(id); $('nextbtn').textContent = i === ORDER.length - 1 ? 'Back to start ↺' : 'Next ↓';
}
function mark(id) { for (const k in cards) cards[k].el.classList.toggle('here', k === id); }
function navState(id) {
  const i = ORDER.indexOf(id);
  document.querySelectorAll('nav.top [data-go]').forEach(b => b.classList.toggle('on', b.dataset.go === id));
  rail.querySelectorAll('button').forEach((b, j) => { b.classList.toggle('on', j === i); b.classList.toggle('done', i > -1 && j < i); });
  $('count').textContent = i < 0 ? '— / 09' : String(i + 1).padStart(2, '0') + ' / ' + String(ORDER.length).padStart(2, '0');
}
function countUp(el) {
  el.querySelectorAll('[data-count]').forEach(b => { const n = +b.dataset.count, t0 = performance.now(); if (still) return;
    const f = () => { const k = Math.min(1, (performance.now() - t0) / 900); b.textContent = Math.round(n * ease(k)); if (k < 1) requestAnimationFrame(f); }; b.textContent = 0; f(); });
}
const step = d => { if (flight) return; const i = ORDER.indexOf(current); const j = i < 0 ? 0 : i + d; if (j >= ORDER.length) return go(ORDER[0]); if (j < 0) return go('overview'); go(ORDER[j]); };

// ---------- input: drag looks, scroll / swipe / keys travel ----------
const el = $('css');
let down = null, moved = 0, wheelAcc = 0, wheelT = 0;
el.addEventListener('pointerdown', e => { if (flight) return; down = { x: e.clientX, y: e.clientY, yaw: tYaw, pitch: tPitch, pan: pan.y, touch: e.pointerType === 'touch' }; moved = 0; el.classList.add('dragging'); });
addEventListener('pointermove', e => {
  if (!down) return;
  const dx = e.clientX - down.x, dy = e.clientY - down.y; moved = Math.max(moved, Math.hypot(dx, dy));
  const k = 0.16, lim = current === 'overview' ? 40 : 24;
  tYaw = THREE.MathUtils.clamp(down.yaw - dx * k, -lim, lim);
  if (!down.touch) tPitch = THREE.MathUtils.clamp(down.pitch + dy * k * .7, -16, 14);
  else if (pan.max && Math.abs(dy) > Math.abs(dx)) { pan.y = THREE.MathUtils.clamp(down.pan - dy * pan.k, 0, pan.max); tYaw = down.yaw; }
  if (moved > 6) hideHint();
});
addEventListener('pointerup', e => {
  if (down && down.touch) {
    const dx = e.clientX - down.x, dy = e.clientY - down.y;
    if (Math.abs(dy) > 60 && Math.abs(dy) > Math.abs(dx) * 1.3) {
      const atEnd = !pan.max || (dy < 0 ? down.pan >= pan.max - 1 : down.pan <= 1);   // only travel once the card has been read to its end
      if (atEnd) step(dy < 0 ? 1 : -1);
    }
  }
  down = null; el.classList.remove('dragging');
});
addEventListener('pointercancel', () => { down = null; el.classList.remove('dragging'); });
addEventListener('wheel', e => {
  if (!$('list').hidden) return; e.preventDefault();
  const now = performance.now(); if (now - wheelT > 500) wheelAcc = 0; wheelT = now; wheelAcc += e.deltaY;
  if (pan.max && !flight) { const ny = THREE.MathUtils.clamp(pan.y + e.deltaY * pan.k, 0, pan.max); const used = ny !== pan.y; pan.y = ny; if (used) { wheelAcc = 0; return; } }
  if (Math.abs(wheelAcc) > 60 && !flight) { step(wheelAcc > 0 ? 1 : -1); wheelAcc = 0; hideHint(); }
}, { passive: false });
addEventListener('keydown', e => {
  if (!$('list').hidden) return;
  if (['ArrowDown', 'ArrowRight', 'PageDown', ' '].includes(e.key)) { e.preventDefault(); step(1); }
  if (['ArrowUp', 'ArrowLeft', 'PageUp'].includes(e.key)) { e.preventDefault(); step(-1); }
  if (e.key === 'Escape') go('overview');
});
function hideHint() { $('hint').style.opacity = 0; }
document.querySelectorAll('header [data-go], #rail [data-go]').forEach(b => b.addEventListener('click', () => { closeList(); go(b.dataset.go); }));
$('nextbtn').addEventListener('click', () => { if (pan.max && pan.y < pan.max - 1) { pan.y = Math.min(pan.max, pan.y + innerHeight * 0.6 * pan.k); return; } step(1); });
$('listbtn').addEventListener('click', () => $('list').hidden ? openList() : closeList());
function openList() { buildList(); $('list').hidden = false; $('listbtn').textContent = '3D view'; $('nextbtn').hidden = true; }
function closeList() { $('list').hidden = true; $('listbtn').textContent = 'List view'; $('nextbtn').hidden = false; }

// ---------- frame loop ----------
const up = new THREE.Vector3(0, 1, 0), tmp = new THREE.Vector3();
function frame(now) {
  if (flight) {
    const k = Math.min(1, (now - flight.t0) / flight.dur), t = ease(k);
    const tt = Math.min(t, .9995), p = flight.path.getPointAt(tt), tan = flight.path.getTangentAt(Math.min(.999, tt + .01));
    // keep the destination in frame while travelling, with a little lean into each turn
    const look = flight.fromLook.clone().lerp(flight.toLook, smooth(.02, .7, k)).addScaledVector(tan, 260 * Math.sin(Math.PI * k));
    cam.pos.copy(p); cam.look.copy(look);
    trailGeo.setDrawRange(0, Math.max(2, Math.round(flight.pts.length * t)));
    headMat.opacity = smooth(0, .08, k) * (1 - smooth(.8, .95, k)); head.position.copy(flight.path.getPointAt(Math.min(.9995, tt + .06)));
    if (k >= 1) { const v = viewFor(flight.id); cam.pos.copy(v.pos); cam.look.copy(v.look); arrive(flight.id); }
  }
  yaw += (tYaw - yaw) * .12; pitch += (tPitch - pitch) * .12;
  const dir = cam.look.clone().sub(cam.pos), dist = dir.length(); dir.normalize();
  const right = new THREE.Vector3().crossVectors(dir, up).normalize();
  dir.applyQuaternion(new THREE.Quaternion().setFromAxisAngle(right, THREE.MathUtils.degToRad(-pitch))).applyQuaternion(new THREE.Quaternion().setFromAxisAngle(up, THREE.MathUtils.degToRad(yaw)));
  pan.cur += (pan.y - pan.cur) * .22;
  camera.position.copy(cam.pos).addScaledVector(right, -yaw * 8).addScaledVector(up, pitch * 6 - pan.cur);
  camera.lookAt(tmp.copy(camera.position).addScaledVector(dir, dist));
  // ground rings breathe gently
  const s = 1 + Math.sin(now / 700) * .06; for (const k in cards) cards[k].ring.scale.setScalar(k === current ? s * 1.25 : 1);
  gl.render(scene, camera); css.render(cssScene, camera);
  requestAnimationFrame(frame);
}
function resize() {
  const w = innerWidth, h = innerHeight;
  camera.aspect = w / h; camera.fov = w < 700 ? 50 : 38; camera.updateProjectionMatrix();
  gl.setSize(w, h, false); css.setSize(w, h); setOverview();
  if (!flight) { const v = viewFor(current === 'flying' ? 'overview' : current); cam.pos.copy(v.pos); cam.look.copy(v.look); }
}
addEventListener('resize', resize); resize();
cam.pos.copy(OVER.pos); cam.look.copy(OVER.look);
requestAnimationFrame(frame);
// Opening move: a beat on the whole grid, then the camera travels in to the intro.
const startAt = location.hash.slice(1);
setTimeout(() => go(cards[startAt] ? startAt : 'hero'), still ? 0 : 900);
window.__wmp = { go, step, get current() { return current; }, cards };   // QA
</script>
</body></html>
