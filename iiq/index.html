<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Corporate Work · Josiah Walker</title>
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="referrer" content="strict-origin-when-cross-origin">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://player.vimeo.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;1,6..72,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root { --ink:#0d0b09; --paper:#efe6d4; --dim:#b7ab95; --green:#9fc2a3; --red:#e2a08f; --rule:rgba(239,230,212,0.22); --display:'Newsreader','Iowan Old Style',Georgia,serif; --mono:'IBM Plex Mono',ui-monospace,'SF Mono',Menlo,monospace; color-scheme:dark; }
* { box-sizing:border-box; }
[hidden] { display:none !important; }
body { margin:0; background:var(--ink); color:var(--paper); font-family:var(--mono); font-size:13px; min-height:100vh; display:flex; flex-direction:column; }
a { color:var(--paper); } a:hover { color:var(--green); } :focus-visible { outline:2px solid var(--green); outline-offset:3px; }
header { display:flex; align-items:center; justify-content:space-between; gap:16px; padding:calc(env(safe-area-inset-top,0px) + 14px) max(16px,2.2vw) 14px; border-bottom:1px solid var(--rule); }
.name { font-family:var(--display); font-size:clamp(21px,2.4vw,34px); letter-spacing:.02em; text-decoration:none; line-height:1.05; display:inline-flex; flex-direction:column; }
.name small { font-family:var(--mono); font-size:clamp(9.5px,1vw,11px); letter-spacing:.14em; text-transform:uppercase; color:var(--dim); margin-top:4px; white-space:nowrap; }
nav { display:flex; gap:clamp(9px,1.4vw,18px); }
nav a { text-decoration:none; text-transform:uppercase; letter-spacing:.12em; font-size:clamp(9.5px,1vw,11px); color:var(--dim); }
nav a:hover { color:var(--paper); }
main { flex:1; width:100%; margin:0 auto; padding:clamp(28px,6vw,72px) max(16px,2.2vw); }
#lock { max-width:26rem; margin:0 auto; }
#reel { max-width:96rem; margin:0 auto; }
.kicker { font-size:11px; letter-spacing:.16em; text-transform:uppercase; color:var(--dim); margin:0 0 10px; }
h1 { margin:0 0 22px; font-family:var(--display); font-weight:400; font-size:clamp(32px,5vw,52px); line-height:1; letter-spacing:-.01em; }
p { font-family:var(--display); font-size:clamp(16px,1.5vw,19px); line-height:1.55; margin:0 0 16px; }
label { display:block; font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--dim); margin:16px 0 6px; }
input { width:100%; font:inherit; font-size:16px; color:var(--paper); background:transparent; border:1px solid var(--rule); padding:10px 12px; border-radius:0; }
input:focus { border-color:var(--paper); outline:none; }
.btn { font:inherit; font-size:11px; letter-spacing:.12em; text-transform:uppercase; background:var(--paper); color:var(--ink); border:1px solid var(--paper); padding:10px 14px; min-height:44px; cursor:pointer; margin-top:14px; width:100%; }
.btn:hover { background:var(--green); border-color:var(--green); }
.btn[disabled] { opacity:.6; cursor:progress; }
.msg { min-height:1.4em; margin-top:12px; font-size:12px; color:var(--red); }
.list { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:clamp(28px,3vw,44px) clamp(16px,2vw,28px); margin-top:clamp(20px,3vw,36px); }
@media (max-width:1000px) { .list { grid-template-columns:repeat(2,minmax(0,1fr)); } }
@media (max-width:620px) { .list { grid-template-columns:1fr; gap:32px; } }
.list.one { grid-template-columns:1fr; max-width:64rem; }
figure { margin:0; }
.frame { position:relative; width:100%; aspect-ratio:16/9; background:#1a1612; border:1px solid var(--rule); }
.frame iframe, .frame video { position:absolute; inset:0; width:100%; height:100%; border:0; background:#000; }
.load { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:12px; font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--dim); }
.bar { width:min(240px,60%); height:2px; background:var(--rule); }
.bar i { display:block; height:100%; width:0; background:var(--paper); transition:width .2s; }
.load button { font:inherit; color:var(--paper); background:none; border:1px solid var(--rule); padding:8px 12px; cursor:pointer; }
figcaption { display:flex; align-items:baseline; justify-content:space-between; gap:6px 14px; flex-wrap:wrap; margin-top:10px; }
.t { font-family:var(--display); font-size:clamp(17px,1.35vw,20px); }
.c { font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--dim); }
.n { font-size:11px; letter-spacing:.14em; color:var(--dim); margin-right:10px; }
.placeholder { color:var(--green); font-family:var(--mono); font-size:13px; }
.out { font:inherit; font-size:10px; letter-spacing:.14em; text-transform:uppercase; color:var(--dim); background:none; border:0; padding:0; cursor:pointer; text-decoration:underline; }
.out:hover { color:var(--paper); }
footer { display:flex; justify-content:space-between; gap:16px; padding:18px max(16px,2.2vw) calc(env(safe-area-inset-bottom,0px) + 18px); font-size:10px; letter-spacing:.14em; text-transform:uppercase; color:var(--dim); border-top:1px solid var(--rule); }
</style></head><body>
<header>
  <a class="name" href="../">Josiah Walker<small>Writer / Director</small></a>
  <nav aria-label="Site">
    <a href="../bio/">Bio</a>
    <a href="../contact/">Contact</a>
    <a href="https://www.instagram.com/josiahwalker_/">Instagram</a>
    <a href="https://www.imdb.com/name/nm9711704/">IMDb</a>
  </nav>
</header>
<main>
  <section id="lock" aria-labelledby="lockh">
    <p class="kicker">Private</p>
    <h1 id="lockh">Corporate Work</h1>
    <p>This page is password protected.</p>
    <form id="f" autocomplete="off">
      <label for="pw">Password</label>
      <input id="pw" type="password" autocomplete="current-password" autocapitalize="off" spellcheck="false" required>
      <button class="btn" id="go" type="submit">View the work</button>
      <div class="msg" id="msg" role="alert" aria-live="assertive"></div>
    </form>
  </section>
  <section id="reel" hidden aria-labelledby="reelh">
    <p class="kicker">Selected work</p>
    <h1 id="reelh">Corporate Work</h1>
    <p id="intro" hidden></p>
    <div class="list" id="list"></div>
  </section>
</main>
<footer><span>© 2026 Walker Motion Pictures</span><button class="out" id="out" type="button" hidden>Lock</button></footer>
<script>
(() => {
  const BLOB = {"v": 1, "rounds": 600000, "salt": "stflgtbgloZ04yKyPeP1JQ==", "iv": "n3C8IqEqNqpS4ajZ", "ct": "xaLfzoKBDm7pLERbTdrRYGD9nsVx7rowLPkEIzrPx4I/Yy0V5ZPFZD0+rzx5c2y7XSbq6K7e8Kd2RqI9eYesvAvt07zhQYCMLjIn0EZjeSRFJob5YGgPLFL3EhZs5D5oh93NpCxKUecAXSWJX4Sn5+JeBuvwGafIOWqI3vHHCbpxEIhPiD0bDxntfSQZvbYpBJzD8+weP/ZwSVJfXwvXV0V/BgFFqAjn3keQ+6L6YfrcnrmygTPkbEXouSf9hePCw03zA+sSbLEZxvot3g8="};
  const $ = id => document.getElementById(id);
  const KEY = 'corp-pw:' + location.pathname;
  const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  const store = { get() { try { return sessionStorage.getItem(KEY); } catch (e) { return null; } },
                  set(v) { try { sessionStorage.setItem(KEY, v); } catch (e) {} },
                  del() { try { sessionStorage.removeItem(KEY); } catch (e) {} } };

  async function decrypt(pw) {
    const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
    const key = await crypto.subtle.deriveKey({ name: 'PBKDF2', hash: 'SHA-256', salt: b64(BLOB.salt), iterations: BLOB.rounds },
      base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
    const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(BLOB.iv) }, key, b64(BLOB.ct));
    return { d: JSON.parse(new TextDecoder().decode(plain)), key };
  }

  // Self-hosted video: the file on the server is AES-GCM ciphertext under the page key. Download it with progress,
  // decrypt it in the browser and play it from memory.
  async function loadFile(v, key, frame, label) {
    frame.textContent = '';
    const box = el('div', 'load'), txt = el('span', null, 'Loading video'), bar = el('div', 'bar'), fill = el('i');
    bar.append(fill); box.append(txt, bar); frame.append(box);
    try {
      const res = await fetch(v.file, { cache: 'force-cache' });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const total = v.bytes || +res.headers.get('content-length') || 0;
      let buf;
      if (res.body && total) {
        buf = new Uint8Array(total); let got = 0; const rd = res.body.getReader();
        for (;;) { const { done, value } = await rd.read(); if (done) break;
          if (got + value.length > buf.length) { const nb = new Uint8Array(got + value.length); nb.set(buf.subarray(0, got)); buf = nb; }
          buf.set(value, got); got += value.length; fill.style.width = Math.min(100, got / total * 100).toFixed(1) + '%'; }
        buf = buf.subarray(0, got);
      } else buf = new Uint8Array(await res.arrayBuffer());
      txt.textContent = 'Preparing';
      const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(v.iv) }, key, buf);
      const vid = el('video');
      vid.src = URL.createObjectURL(new Blob([plain], { type: v.mime || 'video/mp4' }));
      vid.controls = true; vid.playsInline = true; vid.preload = 'auto';
      vid.setAttribute('controlsList', 'nodownload'); vid.disablePictureInPicture = false;
      vid.title = label; vid.addEventListener('contextmenu', e => e.preventDefault());
      vid.addEventListener('play', () => pauseOthers(vid));
      frame.textContent = ''; frame.append(vid);
    } catch (e) {
      txt.textContent = 'The video did not load'; bar.remove();
      const again = el('button', null, 'Try again'); again.type = 'button';
      again.addEventListener('click', () => loadFile(v, key, frame, label)); box.append(again);
    }
  }

  function pauseOthers(except) {
    document.querySelectorAll('.frame video').forEach(x => { if (x !== except && !x.paused) x.pause(); });
    document.querySelectorAll('.frame iframe').forEach(f => { if (f !== except) f.contentWindow.postMessage(JSON.stringify({ method: 'pause' }), 'https://player.vimeo.com'); });
  }

  const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };

  function render(d, key) {
    if (d.title) { $('reelh').textContent = d.title; document.title = d.title + ' · Josiah Walker'; }
    if (d.intro) { $('intro').textContent = d.intro; $('intro').hidden = false; }
    const list = $('list'); list.textContent = ''; const one = d.videos.length === 1; list.classList.toggle('one', one);
    d.videos.forEach((v, i) => {
      const fig = el('figure'), frame = el('div', 'frame'), label = v.title || ('Video ' + (i + 1));
      if (v.file) loadFile(v, key, frame, label); else {
      const f = el('iframe');
      const q = new URLSearchParams({ title: '0', byline: '0', portrait: '0', dnt: '1', playsinline: '1' }); if (v.h) q.set('h', v.h);
      f.src = 'https://player.vimeo.com/video/' + encodeURIComponent(v.vimeo) + '?' + q;
      f.allow = 'autoplay; fullscreen; picture-in-picture; clipboard-write';
      f.allowFullscreen = true;
      f.loading = i < 2 ? 'eager' : 'lazy';
      f.referrerPolicy = 'strict-origin-when-cross-origin';
      f.title = v.title || ('Video ' + (i + 1));
      frame.append(f);
      }
      const cap = el('figcaption'), left = el('div');
      if (!one) left.append(el('span', 'n', String(i + 1).padStart(2, '0')));
      if (v.title) left.append(el('span', 't', v.title));
      cap.append(left);
      if (v.client) cap.append(el('span', 'c', v.client));
      fig.append(frame, cap); list.append(fig);
    });
    $('lock').hidden = true; $('reel').hidden = false; $('out').hidden = false;
    $('reelh').focus && $('reelh').setAttribute('tabindex', '-1');
  }

  // One video at a time: when one starts, pause the others (Vimeo player postMessage API).
  addEventListener('message', ev => {
    if (!/^https:\/\/player\.vimeo\.com$/.test(ev.origin)) return;
    let m = ev.data; if (typeof m === 'string') { try { m = JSON.parse(m); } catch (e) { return; } }
    const frames = [...document.querySelectorAll('.frame iframe')];
    if (m && m.event === 'ready') frames.forEach(f => { if (f.contentWindow === ev.source) f.contentWindow.postMessage(JSON.stringify({ method: 'addEventListener', value: 'play' }), 'https://player.vimeo.com'); });
    if (m && m.event === 'play') { document.querySelectorAll('.frame video').forEach(x => x.pause()); frames.forEach(f => { if (f.contentWindow !== ev.source) f.contentWindow.postMessage(JSON.stringify({ method: 'pause' }), 'https://player.vimeo.com'); }); }
  });

  async function tryOpen(pw, quiet) {
    $('go').disabled = true; $('msg').textContent = quiet ? '' : 'Checking…'; $('msg').style.color = 'var(--dim)';
    try { const { d, key } = await decrypt(pw); store.set(pw); render(d, key); $('reelh').focus(); }
    catch (e) { store.del(); if (!quiet) { $('msg').style.color = ''; $('msg').textContent = window.crypto && crypto.subtle ? 'That password is not right.' : 'This browser cannot open the page. Try a current browser.'; $('pw').select(); } }
    finally { $('go').disabled = false; if (quiet) $('msg').textContent = ''; }
  }

  $('f').addEventListener('submit', e => { e.preventDefault(); const pw = $('pw').value; if (pw) tryOpen(pw, false); });
  $('out').addEventListener('click', () => { store.del(); location.reload(); });
  const saved = store.get(); if (saved) tryOpen(saved, true); else $('pw').focus();
})();
</script>
</body></html>
